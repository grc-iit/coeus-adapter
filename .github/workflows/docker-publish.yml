name: Publish CI image

# Manual only. This builds iowarp-core + adios2-coeus from source under Spack,
# which takes hours - it must not run on every push. Bump the tag, run this
# once, then point cmake.yml's container image at the new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # A hosted runner ships ~14 GB free; the Spack build tree needs more.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Context is the repo root: the dockerfile COPYs CI/coeus and
          # CI/docker/spack.yaml.
          context: .
          file: CI/docker/coeus.dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coeus:${{ inputs.tag }}
