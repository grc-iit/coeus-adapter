name: coeus-xcompact3d

pkgs:               # Period to rescan targets for statistics (capacity, bandwidth, etc.) (ms)
  - pkg_type: jarvis_coeus.incompact3d
    pkg_name: jarvis_coeus.incompact3d
    benchmarks: "pipe_flow"
    output_location: "${HOME}/incompact3d/output"
    nprocs: 4
    ppn: 16
    engine: "hermes"

