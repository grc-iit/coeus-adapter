name: coeus-xcompact3d

pkgs:
  # Stage 1: Launch IOWarp runtime on all nodes in the hostfile (via parallel SSH)
  - pkg_type: jarvis_iowarp.wrp_runtime
    pkg_name: runtime
    num_threads: 4
    client_data_segment_size: "2G"
    port: 9413
    ipc_mode: "shm"
    log_level: "info"
    sleep: 0

  # Stage 2: Deploy CTE pools on all nodes (via parallel SSH + chimaera compose)
  - pkg_type: jarvis_iowarp.wrp_cte
    pkg_name: cte_core
    devices:
      - ["ram::cte_ram_tier1", "16GB", 1.0]
    dpe_type: "max_bw"
    neighborhood: 2
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
  - pkg_type: jarvis_coeus.Incompact3d
    pkg_name: jarvis_coeus.Incompact3d
    benchmarks: "tgv"
    output_location: "/mnt/common/hxu40/incompact3d/output"
    nprocs: 64
    ppn: 16
    engine: "hermes"

# Environment configuration (optional)
# env:
#   WRP_CTE_LOG_LEVEL: "info"
#   CTE_DEBUG: "0" 
