name: coeus-gray-scott

pkgs:
  - pkg_type: jarvis_iowarp.wrp_runtime
    pkg_name: runtime
    num_threads: 4
    client_data_segment_size: "2G"
    port: 9413
    ipc_mode: "tcp"
    log_level: "info"
    sleep: 0

  - pkg_type: jarvis_iowarp.wrp_cte
    pkg_name: cte_core
    devices:
      - ["ram::cte_ram_tier1", "4GB", 1.0]
    dpe_type: "max_bw"
    neighborhood: 2
    default_target_timeout_ms: 30000
    poll_period_ms: 5000


  - pkg_type: jarvis_coeus.adios2_gray_scott
    pkg_name: jarvis_coeus.adios2_gray_scott
    L: 128
    nprocs: 32                            # Number of MPI processes
    ppn: 16                               # Processes per node
    out_file: "${HOME}/iowarp/gsbench.bp"
    steps: 200
    engine: "hermes"

# Environment configuration (optional)
# env:
#   WRP_CTE_LOG_LEVEL: "info"
#   CTE_DEBUG: "0"