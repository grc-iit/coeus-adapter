# LAMMPS velocity-Verlet integration failure -> temperature trigger (Vigil).
#
# A dilute Lennard-Jones fluid (rho*=0.5) integrated with a timestep 10x too
# large (dt*=0.05): the velocity-Verlet shadow Hamiltonian ceases to exist, the
# kinetic temperature explodes from ~1 to >2e6 within a few steps, and LAMMPS
# dies with "ERROR: Lost atoms" ~step 6. The trigger signal is the kinetic
# temperature: variance(vx) ~= <vx^2> = T* (the raw-field path, computed by the
# engine directly from the CTE block -- the working path per the RUNBOOK; the
# derived mean(derive/V2mean)=3T* path is still blocked). The engine pools
# variance(vx) N_b-weighted and FIRES on the first step it exceeds
# trigger_baseline_ratio x the first-step baseline.
#
# Needs the +adios LAMMPS build (our modified `dump custom/adios` declares one
# 1-D global var per column so ADIOS2 has a `vx` to trigger on). Set `lmp_bin`.
# See test/real_apps/lammps/RUNBOOK.md (Run B, the tested jarvis path).
#
# Paper's three conditions share this file -- change `dt` and `steps`:
#   explosion (this file): rho=0.5  dt=0.05  steps=5    -> fires ~step 6, Lost atoms
#   drift                : rho=0.8442 dt=0.02 steps=~5000 -> fires mid-trajectory
#   stable reference     : rho=0.8442 dt=0.005 steps=~5000 -> never fires (control)
#
# Log-only by default; the fire event lands in
# <script_location>/lammps_trigger_log.jsonl. For RENDER + REASON, the +adios
# build must also dump the xy positions + a Catalyst pipeline (see RUNBOOK Notes).
#
# Load:  jarvis ppl load yaml test/jarvis/jarvis_coeus/pipelines/vigil/lammps/lammps-explosion.yaml
#        jarvis ppl print | grep -Ei "trigger|dt|rho|engine"
#        jarvis ppl kill && jarvis ppl run
name: coeus-gray-lammps

env:
  TMPDIR: "/home/hxu40/iowarp_prte_tmp"
  # A literal, per-node /dev/shm dir shared by the clio daemon (pssh) and the
  # application ranks (mpiexec -x). See ../../gray-scott/... for the rationale.
  CLIO_MEMFD_DIR: "/dev/shm/clio_hxu40"

pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    client_data_segment_size: "2G"
    port: 9413
    dbg_port: 4000
    log_level: "info"
    ipc_mode: "shm"
    swim_enabled: false

  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
      - ["ram::cte_ram_tier1", "32GB", 1.0]
    dpe_type: "max_bw"
    neighborhood: 1
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
    pool_query: "local"

  - pkg_type: jarvis_coeus.lammps
    pkg_name: jarvis_coeus.lammps
    nprocs: 1
    ppn: 1
    engine: "hermes"
    script_location: "/mnt/common/hxu40/lammps/output"
    lmp_bin: "/home/hxu40/software/lammps_bench/lammps/build/lmp"   # the +adios LAMMPS build
    # --- explosion state point: dilute LJ, dt* 10x too large ---
    rho: 0.5
    box: 8                              # fcc: 4*box^3 = 2048 atoms
    t0: 0.75                            # equilibrium reduced temperature T*
    dt: 0.05
    steps: 5                            # fires on the post-equilibration step (~step 6)
    dump_every: 1                       # dump + trigger-eval every step
    # --- temperature trigger: variance(vx) ~= T* (raw-field, the working path) ---
    trigger: true
    trigger_type: "variance"
    trigger_variable: "vx"
    trigger_sum_variable: "none"
    trigger_threshold: 0                # 0 -> use baseline_ratio only
    trigger_baseline_ratio: 1.4         # fire when variance(vx) > 1.4x first-step baseline
    trigger_inspect_steps: 3
    trigger_refire: false
