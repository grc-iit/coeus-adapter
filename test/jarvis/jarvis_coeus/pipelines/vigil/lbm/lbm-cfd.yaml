# LBM-CFD 2D variance(vorticity) trigger through the COEUS hermes engine.
#
# The lattice-Boltzmann D2Q9 scheme is driven into instability (force_unstable:
# fewer timesteps -> supersonic lattice speed). The writer declares
# derive/VarVort = variance(vorticity); the engine pools it into the exact
# global variance every output step and FIRES on the first upward crossing of
# trigger_threshold. Stable vorticity variance is ~1e-5, unstable ~1e8, so the
# threshold 1.0 cleanly separates the regimes. Log-only for now (no Catalyst/SST
# render block) -- fire events land in <script_location>/lbm_trigger_log.jsonl.
#
# Load:  jarvis ppl load yaml <this file>
#        jarvis ppl print | grep -Ei "trigger|engine|unstable"
#        jarvis ppl kill && jarvis ppl run
#
# To check the NO-FIRE control instead, set force_unstable: false and steps:
# 20000 (stable von Karman street; variance never crosses 1.0).
name: coeus-lbm-cfd

env:
  TMPDIR: "/home/hxu40/iowarp_prte_tmp"
  # A literal, per-node /dev/shm dir shared by the clio daemon (pssh) and the
  # application ranks (mpiexec -x). See incompact3d.yaml for the full rationale.
  CLIO_MEMFD_DIR: "/dev/shm/clio_hxu40"

pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    client_data_segment_size: "2G"
    port: 9413
    dbg_port: 4000
    log_level: "info"
    ipc_mode: "shm"
    swim_enabled: false

  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
      - ["ram::cte_ram_tier1", "32GB", 1.0]
    dpe_type: "max_bw"
    neighborhood: 1
    default_target_timeout_ms: 30000
    poll_period_ms: 5000
    pool_query: "local"

  - pkg_type: jarvis_coeus.lbm_cfd
    pkg_name: jarvis_coeus.lbm_cfd
    nprocs: 4
    ppn: 4
    engine: "hermes"
    script_location: "/mnt/common/hxu40/lbm_cfd/output"
    out_file: "lbmcfd.bp"
    # --- instability-onset case: fires fast + deterministically ---
    force_unstable: true
    derived: true
    # --- variance(derive/VarVort) trigger ---
    trigger: true
    trigger_type: "variance"
    trigger_variable: "derive/VarVort"
    trigger_sum_variable: "derive/AddVort"
    trigger_threshold: 1.0
    trigger_inspect_steps: 3
